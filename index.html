<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARMADO TRACK — Mahindra Armado Service Tracker</title>
<meta name="theme-color" content="#0f1e35">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARMADO TRACK">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="alsv-icon-192.png">
<link rel="apple-touch-icon" href="alsv-icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Teko:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1a;--panel:#0f1923;--card:#080e18;--border:#1a2d45;--accent:#3b82f6;--green:#10b981;--danger:#ef4444;--warn:#f97316;--text:#e2e8f0;--muted:#7b8ba3;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',system-ui,sans-serif;font-size:15px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.mono{font-family:'Share Tech Mono',ui-monospace,monospace}
header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#0a1628,#0f1e35);border-bottom:2px solid var(--accent);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-i{width:38px;height:38px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px}
.logo-t{font-family:'Teko',sans-serif;font-size:25px;font-weight:600;letter-spacing:2px;color:var(--accent);line-height:1}
.logo-s{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.hb{display:flex;gap:6px}
.btn{border:none;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;letter-spacing:.5px}
.btn-p{background:var(--accent);color:#fff}
.btn-g{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.35)}
.btn-ok{background:var(--green);color:#04130d}
.btn-o{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-d{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.btn-s{padding:4px 10px;font-size:11px}
.bar{background:rgba(59,130,246,.06);border-bottom:1px solid rgba(59,130,246,.15);padding:6px 16px;font-size:11px;color:var(--accent)}
main{max-width:1000px;margin:0 auto;padding:14px 14px 90px}
#banner{display:none;margin-bottom:14px;border:1px solid rgba(239,68,68,.45);background:linear-gradient(135deg,#1a0a0a,#1f1010);border-radius:12px;overflow:hidden}
#banner.warn{border-color:rgba(249,115,22,.5);background:linear-gradient(135deg,#1a1000,#1f1500)}
.bn-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer}
.bn-t{font-family:'Teko',sans-serif;font-size:18px;letter-spacing:1px;color:var(--danger)}
#banner.warn .bn-t{color:var(--warn)}
.bn-c{background:var(--danger);color:#fff;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700;margin-left:8px}
#banner.warn .bn-c{background:var(--warn)}
#bnItems{display:none;padding:0 12px 12px;flex-direction:column;gap:6px}
#bnItems.open{display:flex}
.bn-i{background:rgba(255,255,255,.04);border-radius:9px;padding:8px 11px;cursor:pointer}
.bn-i b{font-size:14px}
.bn-i div{font-size:12px;color:#cbd5e1;margin-top:2px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.sc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px;border-top:3px solid var(--accent)}
.sc.g{border-top-color:var(--green)}.sc.w{border-top-color:var(--warn)}.sc.r{border-top-color:var(--danger)}
.sc small{display:block;font-size:9px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}
.sc span{font-family:'Teko',sans-serif;font-size:28px;line-height:1.1}
.sc.g span{color:var(--green)}.sc.w span{color:var(--warn)}.sc.r span{color:var(--danger)}
.sc:first-child span{color:var(--accent)}
.box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.h2{font-family:'Teko',sans-serif;font-size:20px;letter-spacing:1.5px;color:var(--accent);margin-bottom:10px}
.srow{display:flex;gap:8px}
.inp,select.inp{background:#1a2638;border:1px solid #33465f;border-radius:8px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:15px;font-weight:600;width:100%;outline:none}
.inp:focus{border-color:var(--accent)}
.inp[readonly]{opacity:.6}
.fl{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.fl label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.fl small{font-size:10px;color:var(--muted);text-transform:none;letter-spacing:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--muted);padding:22px;font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.card.due-now{border-color:rgba(239,68,68,.55);box-shadow:0 0 16px rgba(239,68,68,.12)}
.card.due-soon{border-color:rgba(249,115,22,.5)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border);gap:8px}
.ci{display:flex;gap:10px;align-items:center}
.cico{width:40px;height:40px;border-radius:10px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.35);display:flex;align-items:center;justify-content:center;font-size:21px}
.cr{font-family:'Teko',sans-serif;font-size:23px;font-weight:700;color:var(--accent);line-height:1}
.cs{font-size:11px;color:var(--muted)}
.cb{display:flex;gap:5px;flex-shrink:0}
.kmb{padding:11px 14px;border-bottom:1px solid var(--border)}
.kmr{display:flex;justify-content:space-between;align-items:baseline}
.kmr small{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kmv{font-family:'Teko',sans-serif;font-size:24px;font-weight:700}
.pb{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.pb i{display:block;height:100%;border-radius:3px}
.pl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.inf{padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;color:#a7f3d0;background:rgba(16,185,129,.05);display:flex;flex-direction:column;gap:2px}
.inf .w{color:var(--gold)}
.al{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.al b{font-size:14px;display:block;margin-bottom:3px}
.rs{font-size:12px;margin-top:2px}
.rs.due-now{color:#fca5a5}.rs.due-soon{color:#fdba74}
details{border-bottom:1px solid var(--border)}
summary{padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--accent);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.tl{padding:0 14px 12px}
.tg{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border);margin:9px 0 5px;padding-bottom:3px}
.tn2{font-size:11px;color:var(--gold);margin-bottom:6px}
.tr{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(30,45,69,.35);border-radius:7px;padding:6px 10px;margin-bottom:3px}
.tn{font-size:13px;font-weight:600}
.tnote{font-size:10px;color:var(--gold);font-weight:500}
.ttag{font-size:10px;color:#fdba74;font-weight:700;display:block}
.act{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.aI{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.35)}
.aR{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.35)}
.aL{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.35)}
.upd{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border)}
.upd small{font-size:10px;letter-spacing:1px;color:var(--muted);white-space:nowrap}
.upd .inp{max-width:135px;padding:6px 9px;font-size:13px}
.nt{padding:9px 14px;background:rgba(16,185,129,.04)}
.nt small{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.nr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nr .d{flex:1;min-width:120px;font-size:12px}
.nr .d span{display:block;font-size:10px;color:var(--muted)}
a.btn{text-decoration:none;display:inline-block}
.wa{background:rgba(37,211,102,.15);color:#25d366;border:1px solid rgba(37,211,102,.35)}
.ml{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.35)}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
.md{background:var(--panel);border:1px solid var(--border);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto}
@media(min-width:600px){.mo{align-items:center}.md{border-radius:14px}}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.mt{font-family:'Teko',sans-serif;font-size:23px;letter-spacing:1px;color:var(--accent)}
.ms{font-size:11px;color:var(--muted);margin-bottom:12px}
.ma{display:flex;gap:8px;margin-top:12px}
.ma .btn{flex:1;padding:12px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
